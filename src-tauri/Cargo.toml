[package]
name = "p2p-qr"
version = "1.0.2"
description = "Quản lý lệnh Binance P2P và sinh QR chuyển khoản VietQR"
authors = ["Hikhai"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }

# Cầu nối HTTP với extension
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Gọi API Binance
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["clock"] }

# Lưu trữ
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite", "macros", "migrate"] }
dirs = "5.0"
# Kho khoá của hệ điều hành cho API key/secret của Binance.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# Chỉ còn dùng để đọc credentials base64 do bản cũ ghi vào SQLite và chuyển sang keyring.
base64 = "0.22"

# Log có cấp độ, thay cho println!
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Bot SELL: WebSocket chat Binance + upload QR
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
urlencoding = "2.1"
# VietQR trả PNG — chuyển sang JPEG thật trước khi upload chat Binance
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
